[project]
name = "chase-report"
version = "0.1.0"
description = "chase report service: violation evidence -> PDF complaint -> email"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.0",
  "gunicorn>=22",
  "jinja2>=3.1",
  "weasyprint>=62",
  "google-cloud-storage>=2.16",
  "google-auth>=2.29",
  "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chase_report"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "pdf: needs WeasyPrint's system libraries (runs in the report image and CI)",
  "ffmpeg: needs the ffmpeg binary (runs in the report image and CI)",
]
