# Builds the listener image and pushes it to the orb cluster's registry
# (GCP Artifact Registry). Auth is keyless: GitHub's OIDC token is exchanged
# for a short-lived Google token via Workload Identity Federation, configured
# in evil-wizard-corp/orb terraform/gcp. Google only accepts tokens from main
# and tags of this repo, so PRs build (to catch breakage) but never push.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["listener/**", ".github/workflows/image.yml"]
  pull_request:
    paths: ["listener/**", ".github/workflows/image.yml"]

env:
  IMAGE: us-central1-docker.pkg.dev/wizardhut-orb/images/chase-listener

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets the job request a GitHub OIDC token
    steps:
      - uses: actions/checkout@v7.0.1

      - id: auth
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/690915741443/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: github-push@wizardhut-orb.iam.gserviceaccount.com
          token_format: access_token

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.8.0
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      # Tags: sha-<short> on every build (immutable; what orb pins to),
      # plus 1.2.3 / 1.2 for v* git tags.
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-buildx-action@v4.4.1

      - uses: docker/build-push-action@v7.4.0
        with:
          context: listener
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
