[project]
name = "chase-listener"
version = "0.1.0"
description = "chase listener: dog-bark detection, episode/violation rules, evidence outbox"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "sounddevice>=0.5",
  "soundfile>=0.12",
  "prometheus-client>=0.20",
  "pyyaml>=6.0",
  "ai-edge-litert>=1.0",
  "google-cloud-storage>=2.16",
]

[project.scripts]
chase = "chase.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pyright>=1.1.380"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chase"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "tests"]
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs the real YAMNet model on disk"]
